<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Fight Club</title>
  <desc>Minimal movie poster with film strip shapes.</desc>
  <defs>
    <linearGradient id="fightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b7c5" />
      <stop offset="1" stop-color="#f27d9b" />
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="28" fill="url(#fightBg)" />
  <rect x="70" y="80" width="500" height="260" rx="18" fill="#1a1a1a" opacity="0.2" />
  <g fill="#1a1a1a" opacity="0.55">
    <rect x="110" y="110" width="60" height="40" rx="6" />
    <rect x="110" y="170" width="60" height="40" rx="6" />
    <rect x="110" y="230" width="60" height="40" rx="6" />
    <rect x="470" y="110" width="60" height="40" rx="6" />
    <rect x="470" y="170" width="60" height="40" rx="6" />
    <rect x="470" y="230" width="60" height="40" rx="6" />
  </g>
  <rect x="190" y="140" width="260" height="140" rx="16" fill="#fbe4ea" opacity="0.9" />
  <text x="210" y="210" fill="#1a1a1a" font-size="40" font-family="Arial, sans-serif" font-weight="700" letter-spacing="3">
    FIGHT CLUB
  </text>
  <text x="210" y="245" fill="#1a1a1a" font-size="18" font-family="Arial, sans-serif" opacity="0.8">
